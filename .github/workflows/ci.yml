name: ci

# Push to `staging` → full test matrix (Windows, macOS, Linux × Node 20/22) → if everything passes, `main` is
# fast-forwarded to the tested commit and, when package.json carries a new version, a GitHub release is published.
on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --check mesh.mjs
      - run: npm test

  promote:
    name: promote staging → main (+ release)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main to the tested commit
        run: |
          if git ls-remote --exit-code --heads origin main >/dev/null; then
            git fetch -q origin main
            git merge-base --is-ancestor origin/main HEAD || { echo "::error::main has commits that are not on staging — merge them into staging first"; exit 1; }
          fi
          git push origin HEAD:refs/heads/main
      - name: Release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "v$V already released — nothing to do"; exit 0; fi
          git archive --format=zip --prefix=agent-mesh/ -o "agent-mesh-v$V.zip" HEAD mesh.mjs SKILL.md SETUP.md README.md LICENSE NOTICE package.json package-lock.json
          gh release create "v$V" "agent-mesh-v$V.zip" --target "$GITHUB_SHA" --title "agent-mesh v$V" --generate-notes
