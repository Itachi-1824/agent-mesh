    </g>
<g>
      <text x="440" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="2.2" fill="#6B655A">BOB'S MACHINE</text>
